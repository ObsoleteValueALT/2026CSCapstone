<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .center_text {
            display: flex;
            place-items: center;
            text-align: center;
            align-items: center;
            justify-content: center;
            top: 50%;
            left: 50%;
            padding: 25px;
        }

        h1 {
            font-family: 'Roboto', serif;
            font-weight: bold;
            color: #FFFFFF; 
            
        }

        body {
            background-color: #000000;
        }

        .dr_btn {
            background-color: #00000000;
            color: #FFFFFF;
            font-family: 'Roboto', serif;
            font-size: 25px;
            padding: 12px;
            border: none;
            
            border-radius: 5px;
            cursor: pointer;
            
            font-weight: bold;
          }

          .dr_btn:hover {
            color: #FFFF00;
          }


        .glow {
            color: #fff;
            text-align: center;
            -webkit-animation: glow 1s ease-in-out infinite alternate;
            -moz-animation: glow 1s ease-in-out infinite alternate;
            animation: glow 2s ease-in-out infinite alternate;
            }

        @keyframes glow {
        from {
            text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #ffffff3c, 0 0 40px #ffffff3c, 0 0 50px #ffffff3c, 0 0 60px #ffffff3c, 0 0 70px #ffffff3c;
        }
        to {
            text-shadow: 0 0 20px #fff, 0 0 30px #ffffff, 0 0 40px #ffffff74, 0 0 50px #ffffff74, 0 0 60px #ffffff74, 0 0 70px #ffffff74, 0 0 80px #ffffff74;
            
        }
        }


        .fade_out {
            color: #fff;
            text-align: center;
            -webkit-animation: fade 5s ease-in-out infinite normal;
            -moz-animation: fade 5s ease-in-out infinite normal;
            animation: fade 5s ease-in-out infinite normal;
        }

        .fade_in {
            color: #fff;
            text-align: center;
            -webkit-animation: fade 5s ease-in-out infinite reverse;
            -moz-animation: fade 5s ease-in-out infinite reverse;
            animation: fade 5s ease-in-out infinite reverse;
            }

        @keyframes fade {
        from {
            color: #fff;
            text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #ffffff3c, 0 0 40px #ffffff3c, 0 0 50px #ffffff3c, 0 0 60px #ffffff3c, 0 0 70px #ffffff3c;
        }
        to {
            color:#000000;
            text-shadow: 0 0 20px #000000;
        }
        }

    </style>
    <title>..?</title>
</head>
<body>
    <h1 id="message"class="center_text glow">IT APPEARS YOU HAVE REACHED<br>AN END.<br><br>WILL YOU PERSIST?</h1>
    <h1 id="message2"class="center_text glow"></h1>
    <br>
    <div class="container">
      <div class="center_text">
        <button id="back_btn" class="dr_btn" onclick="history.back()">GO BACK</button> <button id="refuse_btn"class="dr_btn" onclick="refuse()">DO NOT</button></b>
        </div>
    </div>

    <script>
        function refuse() {
            const btn1 = document.getElementById("back_btn");
            btn1.remove();

            const btn2 = document.getElementById("refuse_btn");
            btn2.remove();

            const message = document.getElementById("message");
            message.classList.add("fade_out");
            
            setTimeout(replaceMessage, 5000)
            
        }

        function replaceMessage() {
            message.style.color = "#000000";
            message.remove();
            const message2 = document.getElementById("message2");
            message2.classList.add("fade_in");
            message2.innerHTML = "THEN, IT WILL REMAIN SO."
            
            setTimeout(hideMessage, 5000)
        }

        function hideMessage() {
            message2.style.color = "#FFFFFF";
            message2.classList.remove("fade_in");
            message2.classList.add("fade_out");
            setTimeout(removeMessage, 4995)
            
        }

        function removeMessage() {
            message2.style.color = "#000000";
            message2.remove();
        }
    </script>
</body>
</html>
